<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>RC Booking Demo</title>
<style>
  @font-face { font-family: "Noto Sans"; font-weight: 400; src: url(fonts/noto-sans-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Noto Sans"; font-weight: 700; src: url(fonts/noto-sans-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Noto Sans"; font-weight: 400; src: url(fonts/noto-sans-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: "Noto Sans"; font-weight: 700; src: url(fonts/noto-sans-latin-ext-700-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: "Noto Sans Bengali"; font-weight: 400; src: url(fonts/noto-sans-bengali-bengali-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Sans Bengali"; font-weight: 700; src: url(fonts/noto-sans-bengali-bengali-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Sans Tamil"; font-weight: 400; src: url(fonts/noto-sans-tamil-tamil-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Sans Tamil"; font-weight: 700; src: url(fonts/noto-sans-tamil-tamil-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Sans Thai"; font-weight: 400; src: url(fonts/noto-sans-thai-thai-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Sans Thai"; font-weight: 700; src: url(fonts/noto-sans-thai-thai-700-normal.woff2) format("woff2"); }

  :root {
    --bg: #f4f6f5; --card: #ffffff; --ink: #17201c; --muted: #4a5751; --line: #d9e0dc;
    --accent: #0b6b57; --accent-ink: #ffffff; --accent-soft: #e2f1ec; --warn-bg: #fff4d6; --warn-ink: #5c4300;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans", "Noto Sans Bengali", "Noto Sans Tamil", "Noto Sans Thai", "Noto Sans CJK SC", sans-serif;
    font-size: 16px; line-height: 1.5; overflow-wrap: anywhere;
  }
  .app { max-width: 480px; margin: 0 auto; padding-bottom: 168px; }
  header { background: var(--accent); color: var(--accent-ink); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; min-width: 0; }
  .lang { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .lang select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 0; min-height: 40px; max-width: 100%; }
  .demo { background: var(--warn-bg); color: var(--warn-ink); padding: 8px 16px; font-size: 14px; }
  main { padding: 16px; }
  h2 { font-size: 22px; margin: 4px 0 4px; }
  h3 { font-size: 16px; margin: 20px 0 8px; }
  .intro { color: var(--muted); margin: 0 0 12px; }
  .centre { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
  .centre .k { color: var(--muted); font-size: 14px; }
  .centre .v { font-weight: 700; }
  .cards { display: grid; gap: 10px; }
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .card .title { font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
  .badge-new { font-size: 12px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; line-height: 20px; font-weight: 700; }
  .card .desc { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
  .card .side { text-align: right; display: grid; gap: 4px; justify-items: end; }
  .status { font-size: 13px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-weight: 700; }
  .price { font-size: 14px; font-weight: 700; }
  .card button.pick { grid-column: 1 / -1; justify-self: start; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; min-height: 40px; min-width: 44px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .slot { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 8px; min-height: 48px; cursor: pointer; }
  .slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .slot small { display: block; font-size: 13px; opacity: .9; }
  .btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; border: 1px solid var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--card); color: var(--accent); }
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 700; text-align: right; }
  .field { margin-top: 12px; }
  .field label { display: block; font-weight: 700; margin-bottom: 4px; }
  .field input { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid #8a9690; border-radius: 10px; min-height: 44px; }
  .helper { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .toast { margin-top: 12px; background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .actionbar { position: fixed; left: 0; right: 0; bottom: 64px; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .actionbar .btn { flex: 1 1 auto; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  nav.tabs button { font: inherit; font-size: 12px; background: none; border: 0; color: var(--muted); display: grid; place-items: center; align-content: center; gap: 0; padding: 4px 2px; line-height: 1.3; min-height: 44px; cursor: pointer; }
  nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  nav.tabs svg { width: 22px; height: 22px; }
  .help-btn { background: none; border: 0; color: var(--accent-ink); width: 44px; height: 44px; cursor: pointer; display: grid; place-items: center; }
  .democtl { background: #102a23; color: #e8f3ef; padding: 12px 16px; font-size: 14px; }
  .democtl p { margin: 0 0 8px; max-width: 480px; }
  .democtl a { color: #9fe3cd; }
  .democtl .ctlrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; max-width: 480px; }
  .democtl select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 0; min-height: 40px; width: 100%; }
  .democtl .ctlnote { margin: 8px 0 0; color: #bcd8cf; }
</style>
<style id="bug-style"></style>
</head>
<body>
<section class="democtl" id="democtl" aria-label="Demo controls">
  <p><b>LinguaCheck demo.</b> Pick a language in the green bar and a seeded change below to see what the tests catch. <a href="../report/">See the results</a> · <a href="../">About</a></p>
  <div class="ctlrow">
    <label for="ctl-bug">Seeded change</label>
    <select id="ctl-bug"></select>
  </div>
  <p class="ctlnote" id="ctl-note"></p>
</section>
<div class="app">
  <header data-testid="header">
    <h1 data-testid="app-title" data-i18n="app_name"></h1>
    <div class="lang" data-testid="lang">
      <label for="lang-select" data-i18n="lang_label"></label>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="bn">বাংলা</option>
        <option value="ta">தமிழ்</option>
        <option value="th">ไทย</option>
        <option value="pseudo">Pseudo</option>
      </select>
    </div>
    <button class="help-btn" data-testid="help-icon" aria-label="Help">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17.5" r="1.2" fill="currentColor"/></svg>
    </button>
  </header>
  <div class="demo" data-testid="demo-note" data-i18n="demo_note"></div>
  <main>
    <h2 data-testid="greeting" data-i18n="greeting"></h2>
    <p class="intro" data-testid="intro" data-i18n="intro"></p>
    <div class="centre" data-testid="centre"><span class="k" data-i18n="centre_label"></span><span class="v" data-i18n="centre_value"></span></div>

    <h3 data-testid="facilities-title" data-i18n="facilities_title"></h3>
    <div class="cards" id="cards"></div>

    <h3 data-testid="date-title" data-i18n="date_title"></h3>
    <div class="days" id="days" data-testid="days"></div>

    <h3 data-testid="time-title" data-i18n="time_title"></h3>
    <div class="slots" id="slots" data-testid="slots"></div>

    <h3 data-testid="summary-title" data-i18n="summary_title"></h3>
    <div class="summary" data-testid="summary">
      <div class="row" data-testid="row-facility"><span class="k" data-i18n="summary_facility"></span><span class="v" id="sum-fac"></span></div>
      <div class="row" data-testid="row-date"><span class="k" data-i18n="summary_date"></span><span class="v" id="sum-date"></span></div>
      <div class="row" data-testid="row-time"><span class="k" data-i18n="summary_time"></span><span class="v" id="sum-time"></span></div>
    </div>

    <div class="field" data-testid="name-field">
      <label for="name" data-i18n="name_label"></label>
      <input id="name" autocomplete="name">
      <p class="helper" data-testid="helper" data-i18n="helper"></p>
    </div>
    <div class="toast" role="status" data-testid="toast" data-i18n="toast"></div>
  </main>
</div>

<div class="actionbar" data-testid="actionbar">
  <button class="btn ghost" data-testid="cancel" data-i18n="cancel"></button>
  <button class="btn primary" data-testid="confirm" data-i18n="confirm"></button>
</div>

<nav class="tabs" data-testid="tabs" aria-label="Main">
  <button data-testid="tab-0" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z" fill="currentColor"/></svg><span data-i18n="nav.0"></span></button>
  <button data-testid="tab-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="nav.1"></span></button>
  <button data-testid="tab-2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="currentColor"/></svg><span data-i18n="nav.2"></span></button>
  <button data-testid="tab-3"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v5M12 16v.5" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="nav.3"></span></button>
</nav>

<script src="i18n.js"></script>
<script src="bugs.js"></script>
<script src="app.js"></script>
</body>
</html>
