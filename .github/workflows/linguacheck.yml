name: LinguaCheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Least privilege: the job only needs to read the code.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python harness/run.py && python harness/report.py
      - uses: actions/upload-artifact@v4
        with:
          name: linguacheck-report
          path: |
            report/index.html
            results/summary.json
